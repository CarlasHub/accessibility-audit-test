# Managed by CarlasHub Accessibility Audit. Re-run setup to update selected pages.
name: Accessibility audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: audit
        name: Run WCAG 2.2 audit
        uses: CarlasHub/accessibility-audit-plugin@v1
        with:
          urls: |-
            https://carlashub.com/
            https://carlashub.com/04-why-i-spent-so-much-time-on-demos
            https://carlashub.com/05-my-first-ai-phase-was-still-experimental
            https://carlashub.com/08-the-bookmarklet-hit-a-wall
            https://carlashub.com/09-the-extension-pivot
            https://carlashub.com/11-release-vs-test-extension
            https://carlashub.com/13-moving-toward-on-device-ai
            https://carlashub.com/a-new-accessibility-test-case-manager
            https://carlashub.com/A11Y-Cat-03-turning-the-panel-into-a-command-tool
            https://carlashub.com/A11Y-Cat-06-when-i-got-serious-about-verification
            https://carlashub.com/A11Y-Cat-07-why-i-built-a-local-assistant-backend
            https://carlashub.com/A11Y-Cat-10-splitting-core-from-delivery
            https://carlashub.com/A11Y-Cat-12-getting-honest-about-screen-reader-claims
            https://carlashub.com/A11Y-Cat-14-the-tool-got-wider-before-it-got-deeper
            https://carlashub.com/A11Y-Cat-15-contrast-and-honesty
            https://carlashub.com/A11Y-Cat-16-language-headings-and-structure
            https://carlashub.com/A11Y-Cat-17-why-i-split-issue-types
            https://carlashub.com/A11Y-Cat-18-why-provenance-started-mattering
            https://carlashub.com/A11Y-Cat-19-history-baselines-and-local-state
            https://carlashub.com/A11Y-Cat-20-diagnostics-and-boundaries
          allowed-hosts: 'carlashub.com'
          fail-on: none
          comment-on-pr: 'false'

      - id: report
        name: Upload the complete report
        if: always() && steps.audit.outputs.output-dir != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: accessibility-audit
          path: |
            ${{ steps.audit.outputs.output-dir }}
            ${{ steps.audit.outputs.archive-path }}
          if-no-files-found: error
          retention-days: 14

      - name: Add the report link to the run summary
        if: always() && steps.report.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          {
            echo '## Accessibility report ready'
            echo
            echo "[Download the complete report]($ARTIFACT_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
