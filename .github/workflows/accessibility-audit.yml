name: Accessibility audit

on:
  workflow_dispatch:
    inputs:
      urls:
        description: Public HTTPS pages to audit, one per line (maximum 20)
        required: true
        type: string
        default: https://example.com/

permissions:
  contents: read

jobs:
  audit:
    name: Audit website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - id: audit
        name: Run WCAG 2.2 audit
        uses: CarlasHub/accessibility-audit-plugin@v1
        with:
          urls: ${{ inputs.urls }}
          fail-on: none
          comment-on-pr: 'false'

      - id: report
        name: Upload the complete report
        if: always() && steps.audit.outputs.output-dir != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: accessibility-audit
          path: ${{ steps.audit.outputs.output-dir }}
          if-no-files-found: error
          retention-days: 14

      - name: Add the report link to the run summary
        if: always() && steps.report.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          {
            echo '## Accessibility report ready'
            echo
            echo "[Download the complete report]($ARTIFACT_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
